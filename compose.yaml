name: flux-browser

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flux_browser
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5432:5432"
    volumes:
      - flux-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flux_browser"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  flux-build:
    profiles: ["build"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FLUX_DB_URL: jdbc:postgresql://postgres:5432/flux_browser
      FLUX_DB_USER: postgres
      FLUX_DB_PASSWORD: "1234"
      FLUX_DB_SCHEMA: flux_browser
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  flux-postgres-data:
